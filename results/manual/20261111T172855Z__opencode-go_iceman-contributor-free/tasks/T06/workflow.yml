name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # major tag retained; immutable commit SHA not verified offline (UNVERIFIED)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4 # major tag retained; immutable commit SHA not verified offline (UNVERIFIED)
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
